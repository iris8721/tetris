<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris + Heuristic Solver</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --border: #1f2937;
      --panel: #111a33;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, var(--bg-1), var(--bg-2));
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #board {
      border: 2px solid var(--border);
      background: #0b1022;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .panel {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
    }

    .stat span:first-child {
      color: var(--muted);
    }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      color: var(--muted);
    }

    input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #0b1022;
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #1e293b;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #273449;
    }

    .keys {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      .layout {
        flex-direction: column;
        align-items: center;
        width: min(100%, 360px);
      }

      #board {
        width: min(100%, 360px);
        height: auto;
      }

      .panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <canvas id="board" width="300" height="600" aria-label="Tetris Board"></canvas>
    <aside class="panel">
      <div class="stat"><span>Score</span><span id="score">0</span></div>
      <div class="stat"><span>Lines</span><span id="lines">0</span></div>
      <div class="stat"><span>Level</span><span id="level">1</span></div>
      <div class="stat"><span>Status</span><span id="status">Auto</span></div>
      <label for="depth">Depth <input id="depth" type="number" min="1" max="6" value="2"></label>
      <button id="autoBtn" type="button">Disable Auto</button>
      <button id="restartBtn" type="button">Restart</button>
      <p class="keys">Arrows move, Up/X/Z rotate, Down soft drops, Space hard drops.</p>
    </aside>
  </main>

  <script src="./solver.js"></script>
  <script src="./game.js"></script>
</body>
</html>
